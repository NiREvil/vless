name: Linter/Formatter

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  create:
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.14'

jobs:
  format-and-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install "black==26.5.1" "ruff==0.16.6"

      - name: Rebuild package-lock.json & Install JS tools
        run: |
          rm -f package-lock.json
          npm install

      - name: Run Formatting & Linting
        run: |
          npm run format:py || true
          npm run lint:py || true
          npm run format:js-family || true
          npm run lint:js || true

      - name: Commit and Push changes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add -A
          if ! git diff --quiet --staged; then
            git commit -m "chore: rebuild package-lock.json and apply formatting/linting" \
              -m "Applied automatic formatting using Prettier/Black and linting using ESLint/Ruff" \
              --author="Diana <135276904+Diana-Cl@users.noreply.github.com>"
            
            git pull --rebase || true
            
            git push
          else
            echo "No formatting changes to commit."
          fi
