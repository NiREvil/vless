mixed-port: 7890
ipv6: true
allow-lan: true
mode: rule
log-level: error
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 10
keep-alive-interval: 15
unified-delay: true
disable-keep-alive: false
external-ui: ui
external-controller: 127.0.0.1:9090
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  respect-rules: false
  use-system-hosts: false
  listen: 127.0.0.1:1053
  nameserver:
    - "1.1.1.1#__DIALER_GROUP__"
  proxy-server-nameserver:
    - 8.8.8.8#DIRECT
  direct-nameserver:
    - 8.8.8.8#DIRECT
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"

tun:
  enable: true
  mtu: 8880
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  endpoint-independent-nat: false
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

__PROXIES_BLOCK__
__PROXY_GROUPS_BLOCK__
rules:
  - MATCH,__SELECTOR_GROUP__

ntp:
  enable: true
  server: time.cloudflare.com
  port: 123
  interval: 30
