  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  respect-rules: false
  use-system-hosts: false
  listen: 127.0.0.1:1053
  nameserver:
    - "1.1.1.1#🇮🇷AUTO-IR-DIALER"
  proxy-server-nameserver:
    - 8.8.8.8#DIRECT
  direct-nameserver:
    - 8.8.8.8#DIRECT
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"

tun:
  enable: true
  mtu: 8880
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  endpoint-independent-nat: false
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

